# main 푸시(또는 수동 실행) 시: 이미지 빌드 -> GHCR 푸시 -> EC2 에서 pull 후 재기동
# 필요한 저장소 secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY(개인키). 선택 variables: APP_DIR(기본 ~/TravelTackle-BE)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT" # GHCR 는 소문자만 허용
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_IMAGE,GHCR_USER,GHCR_TOKEN,APP_DIR
          script: |
            set -e
            cd "${APP_DIR:-$HOME/TravelTackle-BE}"
            git pull --ff-only
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export APP_IMAGE
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d --no-build app
            # 배포마다 새 이미지가 쌓여 디스크가 차는 것을 막는다 (dangling + 안 쓰는 이미지, 빌드 캐시)
            docker image prune -af
            docker builder prune -af
            df -h / | tail -1
        env:
          APP_IMAGE: ${{ needs.build-and-push.outputs.image }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIR: ${{ vars.APP_DIR }}
