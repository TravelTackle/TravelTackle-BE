JWT_SECRET=test-only-jwt-secret-must-be-at-least-32-bytes
tour.service-key=test-only-tour-key

# 개발 서버가 쓰는 ./data/travel_tackle 파일과 락이 충돌하지 않도록, 테스트는 별도 인메모리 DB 사용
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

# CI 에는 gitignore 된 application.yaml 이 없으므로 컨텍스트 기동에 필요한 값은 여기서 전부 준다
spring.mail.host=localhost
spring.mail.port=1025
spring.ai.model.chat=openai
spring.ai.openai.api-key=test-only-openai-key
