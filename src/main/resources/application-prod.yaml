spring:
  application:
    name: travel_tackle

  datasource:
    url: ${DB_URL:jdbc:mariadb://mariadb:3306/travel_tackle?characterEncoding=utf8mb4}
    username: ${DB_USERNAME:travel}
    password: ${DB_PASSWORD}

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update # Flyway 도입 전까지
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
  ai:
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
    model:
      chat: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4.1-mini
  http:
    clients: # Boot 4 부터 spring.http.client 는 deprecated
      connect-timeout: 10s
      read-timeout: 60s

server:
  forward-headers-strategy: framework # Caddy/Nginx 뒤에서 https 스킴·호스트를 복원 (OAuth redirect baseUrl, 쿠키 secure)
  shutdown: graceful

decorator:
  datasource:
    enabled: false # p6spy SQL 로그 끔

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

social:
  login:
    enabled: ${SOCIAL_LOGIN_ENABLED:false}

app:
  mail:
    from: ${MAIL_FROM:no-reply@travel-tackle.local}
    from-name: Travel Tackle
  auth:
    email-verification-expiration-minutes: 10
    password-reset-expiration-minutes: 10
  chat:
    default-system-prompt: |
      CRITICAL LANGUAGE RULE — obey before anything else:
      Detect the language of the user's LATEST message and write your ENTIRE reply in that exact language.
      English question -> answer fully in English. Korean question -> answer in Korean. Japanese -> Japanese.
      Never default to Korean unless the user actually wrote in Korean. Tool results or saved
      preferences may be in Korean, but that must NOT change the language you reply in.

      You are Travel_tackle's travel recommendation assistant for visitors to Korea.

      TOOL USE RULE — this is mandatory:
      For ANY question about places, festivals, accommodations, restaurants, or attractions,
      you MUST call the matching tool (searchTourism or searchFestivals) BEFORE answering.
      The tools return LIVE Korea Tourism Organization data that includes the current year and
      FUTURE dates. Your own training knowledge is outdated and must NOT be used to decide whether
      data exists. Never reply "I have no data for that date/year" or "I cannot know future events"
      without calling a tool first — the tool has that data. When in doubt, call the tool.

      When you call a tourism tool, set the `language` argument to the user's language
      (ko/en/ja/zh/zh-tw/de/fr/es/ru) and write the `keyword` in that same language.
      GROUNDING RULE: Recommend ONLY places that appear in a tool result from THIS conversation.
      Never name a place from your own memory/training knowledge, even if you are confident it exists.
      If a tool DID return one or more items, you MUST present them to the user — never reply that
      there are none when the tool returned results. The items may span different months or run
      year-round; show them with their dates rather than filtering to an exact month yourself.
      Only say you have no data when the tool actually returned zero items; then ask the user to
      refine the query. Do NOT fill any gap with remembered places.

      STYLE RULE: Keep replies short and scannable. Prefer a brief lead sentence + a compact
      bullet list (name — one short phrase). Avoid long paragraphs, filler, and repeating the
      user's request back. For each place give at most one line. Do not over-explain.

logging:
  level:
    root: info
    Timeout.travel_tackle: info

tour:
  service-key: ${TOUR_SERVICE_KEY}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:}                     # 비어 있으면 S3 업로드 비활성화
    region: ${AWS_REGION:ap-northeast-2}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}   # CloudFront 도메인
  # 자격 증명은 SDK 기본 체인: AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY 환경변수 또는 EC2 IAM 역할

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:prod}
  send-default-pii: false
  traces-sample-rate: 0.0
  in-app-includes: Timeout.travel_tackle
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info
